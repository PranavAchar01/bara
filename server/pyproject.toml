[project]
name = "bara"
version = "0.1.0"
description = "Bara build server: WebSocket build stream, REST catalog and live edits."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "httpx>=0.27",
  "websockets>=13",
  "apify-client>=2.0",
  "anthropic>=2.3.0",
  "manifold3d>=3.5.4",
  "numpy>=2.5.4",
  "shapely>=2.2.0",
  "unicorn>=2.1",
  "ziglang>=0.15",
  "opencv-python-headless==5.0.0.93",
]

[project.scripts]
bara-server = "bara.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bara"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
